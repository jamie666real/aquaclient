<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Play minecraft 1.12 in your browser" />
		<meta name="keywords" content="eaglercraft, minecraft, 1.12, 1.12.2" />
		<title>AquaClient v1.0.0 </title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Eaglercraft 1.12 WASM" />
		<meta property="og:description" content="Play minecraft 1.12 in your browser" />
		<meta property="og:image" content="favicon.png" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<style>
			:root{--aqua-1:#00b4d8;--aqua-2:#0077b6;--aqua-3:#90e0ef;--aqua-contrast:#efffff;--aqua-panel:rgba(3,20,31,0.78);--aqua-line:rgba(255,255,255,0.22)}
			html,body{width:100%;height:100%;margin:0;background:radial-gradient(circle at 20% 20%,rgba(96,240,255,0.24),transparent 24%),radial-gradient(circle at 80% 10%,rgba(0,170,255,0.18),transparent 20%),linear-gradient(145deg,#00131d 0%,#004f6f 45%,#00bed6 100%);color:var(--aqua-contrast);font-family:Arial,Helvetica,sans-serif}
			body#game_frame{position:relative;margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(96,240,255,0.26),transparent 28%),radial-gradient(circle at 80% 10%,rgba(0,170,255,0.18),transparent 24%),linear-gradient(145deg,#00131d 0%,#004f6f 45%,#00bed6 100%)}
			body#game_frame::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 90%,rgba(255,255,255,0.14),transparent 18%),radial-gradient(circle at 90% 85%,rgba(255,255,255,0.10),transparent 14%),linear-gradient(180deg,rgba(255,255,255,0.08),transparent 45%,rgba(0,0,0,0.24));pointer-events:none;z-index:0}
			body#game_frame::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.24) 1px,transparent 1px);background-size:24px 24px;opacity:.14;mix-blend-mode:screen;pointer-events:none;z-index:0}
			body#game_frame canvas{position:relative;z-index:1}
			body#game_frame #launch_countdown_screen{background:var(--aqua-panel);border:1px solid var(--aqua-line);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,0.28),inset 0 1px 0 rgba(255,255,255,0.14);backdrop-filter:blur(10px);color:var(--aqua-contrast);padding:24px;position:relative;z-index:1}
			body#game_frame #launch_countdown_screen h1,body#game_frame #launch_countdown_screen h2{color:var(--aqua-contrast);text-shadow:0 0 12px rgba(95,232,255,0.24)}
			body#game_frame #launch_countdown_screen button{background:linear-gradient(135deg,#2ec4ff,#0c7ccf);color:white;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,0.22)}
			body#game_frame #launch_countdown_screen progress,body#game_frame #launch_countdown_screen div[style*="border:2px solid black"]{border-color:rgba(255,255,255,0.24)!important;background:rgba(255,255,255,0.08)!important}
		</style>
		<script type="text/javascript" src="bootstrap.js"></script>
		<script type="text/javascript">
			"use strict";
			function startClient() {
				if(window.__aquaClientLaunched) return;
				window.__aquaClientLaunched = true;
				var aquaUiStyle = document.createElement("style");
				aquaUiStyle.id = "aqua-game-ui-theme";
				aquaUiStyle.textContent = "body.aqua-themed-ui, body.aqua-themed-ui #game_frame{background:radial-gradient(circle at 20% 20%,rgba(96,240,255,0.26),transparent 28%),radial-gradient(circle at 80% 10%,rgba(0,170,255,0.18),transparent 24%),linear-gradient(145deg,#00131d 0%,#004f6f 45%,#00bed6 100%) !important;} body.aqua-themed-ui::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 10% 90%,rgba(255,255,255,0.14),transparent 18%),radial-gradient(circle at 90% 85%,rgba(255,255,255,0.10),transparent 14%),linear-gradient(180deg,rgba(255,255,255,0.08),transparent 45%,rgba(0,0,0,0.24));pointer-events:none;z-index:0;} body.aqua-themed-ui::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.24) 1px,transparent 1px);background-size:24px 24px;opacity:.14;mix-blend-mode:screen;pointer-events:none;z-index:0;} body.aqua-themed-ui *{color:#efffff !important;font-family:Arial,Helvetica,sans-serif !important;position:relative;z-index:1;} body.aqua-themed-ui button, body.aqua-themed-ui input, body.aqua-themed-ui select, body.aqua-themed-ui textarea, body.aqua-themed-ui [role='button'], body.aqua-themed-ui [class*='button'], body.aqua-themed-ui [class*='menu'], body.aqua-themed-ui [class*='panel'], body.aqua-themed-ui [class*='popup'], body.aqua-themed-ui [class*='dialog'], body.aqua-themed-ui [class*='screen'], body.aqua-themed-ui [class*='window']{background:linear-gradient(135deg,#2ec4ff,#0c7ccf) !important;border:1px solid rgba(255,255,255,0.24) !important;color:white !important;border-radius:10px !important;box-shadow:0 8px 20px rgba(0,0,0,0.2) !important;} body.aqua-themed-ui [class*='menu'], body.aqua-themed-ui [class*='panel'], body.aqua-themed-ui [class*='popup'], body.aqua-themed-ui [class*='dialog'], body.aqua-themed-ui [class*='screen'], body.aqua-themed-ui [class*='window']{background:rgba(3,20,31,0.78) !important;border:1px solid rgba(255,255,255,0.16) !important;box-shadow:0 15px 35px rgba(0,0,0,0.28) !important;padding:10px !important;} body.aqua-themed-ui .title, body.aqua-themed-ui h1, body.aqua-themed-ui h2, body.aqua-themed-ui h3{color:#efffff !important;text-shadow:0 0 12px rgba(95,232,255,0.24) !important;} body.aqua-themed-ui canvas{box-shadow:inset 0 0 40px rgba(0,0,0,0.28) !important;}";
				document.head.appendChild(aquaUiStyle);
				document.documentElement.classList.add("aqua-themed-ui");
				document.body.classList.add("aqua-themed-ui");
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
					return;
				}
				
				// %%%%%%%%% launch options %%%%%%%%%%%%
				
				var relayId = Math.floor(Math.random() * 3);
				window.eaglercraftXOpts = {
					demoMode: false,
					container: "game_frame",
					assetsURI: "assets.epw",
					worldsDB: "worlds",
					servers: [
						{ addr: "wss://play.shadownetwork.shop", name: "Shadow Network" },
						{ addr: "wss://plain-survival1.eagler.host", name: "Survival - An Eaglercraft Server" },
						{ addr: "wss://mc.cosmixmc.org", name: "CosmixMC" }
						]
				};
				
				// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
				
				var q = window.location.search;
				if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
					q = new window.URLSearchParams(q);
					var s = q.get("server");
					if(s) window.eaglercraftXOpts.joinServer = s;
				}
				
				main();
			}
			if(document.readyState === "loading") {
				document.addEventListener("DOMContentLoaded", startClient, { once: true });
			} else {
				startClient();
			}
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame"></body>
</html>
