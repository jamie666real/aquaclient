<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="Play minecraft 1.12 in your browser" />
		<meta name="keywords" content="eaglercraft, minecraft, 1.12, 1.12.2" />
		<title>AquaClient v1.0.0 </title>
		<meta property="og:locale" content="en-US" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Eaglercraft 1.12 WASM" />
		<meta property="og:description" content="Play minecraft 1.12 in your browser" />
		<meta property="og:image" content="favicon.png" />
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<style>
			:root{--aqua-1:#00b4d8;--aqua-2:#0077b6;--aqua-3:#90e0ef;--aqua-contrast:#e6ffff;--aqua-panel:rgba(2,17,31,0.82);--aqua-line:rgba(255,255,255,0.18)}
			html,body{width:100%;height:100%;margin:0;background:linear-gradient(180deg,var(--aqua-2),#001f3f);color:var(--aqua-contrast);font-family:Arial,Helvetica,sans-serif}
			body#game_frame{position:relative;margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(125,239,255,0.22),transparent 30%),radial-gradient(circle at 80% 10%,rgba(0,255,255,0.16),transparent 24%),linear-gradient(135deg,#001c2e 0%,#004d6d 45%,#00a8cb 100%)}
			body#game_frame::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.10),transparent 40%,rgba(0,0,0,0.18));pointer-events:none;z-index:0}
			body#game_frame canvas{position:relative;z-index:1}
		</style>
		<script type="text/javascript" src="bootstrap.js"></script>
		<script type="text/javascript">
			"use strict";
			function startClient() {
				if(window.__aquaClientLaunched) return;
				window.__aquaClientLaunched = true;
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
					return;
				}
				
				// %%%%%%%%% launch options %%%%%%%%%%%%
				
				var relayId = Math.floor(Math.random() * 3);
				window.eaglercraftXOpts = {
					demoMode: false,
					container: "game_frame",
					assetsURI: "assets.epw",
					worldsDB: "worlds",
					servers: [
						{ addr: "wss://play.shadownetwork.shop", name: "Shadow Network" },
						{ addr: "wss://plain-survival1.eagler.host", name: "Survival - An Eaglercraft Server" },
						{ addr: "wss://mc.cosmixmc.org", name: "CosmixMC" }
    					]
				};
				
				// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
				
				var q = window.location.search;
				if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
					q = new window.URLSearchParams(q);
					var s = q.get("server");
					if(s) window.eaglercraftXOpts.joinServer = s;
				}
				
				main();
			}
			if(document.readyState === "loading") {
				document.addEventListener("DOMContentLoaded", startClient, { once: true });
			} else {
				startClient();
			}
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame"></body>
</html>
