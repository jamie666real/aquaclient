<!DOCTYPE html>
<html lang="und" style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
		<meta name="description" content="AquaClient web launcher">
		<meta name="keywords" content="aquaclient, eaglercraftx, minecraft, aqua, 1.12">
		<title>AquaClient v1.0.0</title>
		<meta property="og:locale" content="en-US">
		<meta property="og:type" content="website">
		<meta property="og:title" content="AquaClient v1.0.0">
		<meta property="og:description" content="AquaClient launcher for EaglercraftX 1.12">
		<style>
			:root{--aqua-1:#00b4d8;--aqua-2:#0077b6;--aqua-3:#90e0ef;--aqua-contrast:#e6ffff;--aqua-panel:rgba(2,17,31,0.82);--aqua-line:rgba(255,255,255,0.18)}
			html,body{width:100%;height:100%;margin:0;background:linear-gradient(180deg,var(--aqua-2),#001f3f);color:var(--aqua-contrast);font-family:Arial,Helvetica,sans-serif}
			body#game_frame{position:relative;margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#001c2e 0%,#004d6d 45%,#00a8cb 100%);}
			body#game_frame canvas{position:relative;z-index:1}
			.aquatic-shell{position:fixed;inset:0;display:flex;justify-content:flex-end;align-items:flex-start;padding:24px;z-index:20;pointer-events:none}
			.credits-card{width:min(400px,100%);padding:24px 24px 22px;border-radius:24px;border:1px solid var(--aqua-line);background:linear-gradient(145deg,rgba(3,24,41,0.94),rgba(1,16,30,0.88));backdrop-filter:blur(16px);box-shadow:0 20px 55px rgba(0,0,0,0.34);overflow:hidden;position:relative;pointer-events:auto}
			.credits-card::before{content:"";position:absolute;inset:-45px 0 auto 0;height:140px;background:radial-gradient(circle at top,rgba(112,236,255,0.24),transparent 72%);pointer-events:none}
			.credits-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,0.1);color:#9fefff;font-size:12px;text-transform:uppercase;letter-spacing:0.16em;margin-bottom:12px}
			.credits-badge::before{content:"•";font-size:16px;color:#5fe8ff}
			.credits-card h1{margin:0 0 8px;font-size:30px;line-height:1.1;font-weight:700}
			.subtext{margin:0 0 16px;color:#bfefff;font-size:14px;line-height:1.6}
			.profile-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12)}
			.avatar-preview{width:84px;height:84px;border-radius:20px;object-fit:cover;border:2px solid rgba(255,255,255,0.2);background:linear-gradient(135deg,#0e3a4f,#0a2138);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}
			.profile-meta h2{margin:0 0 4px;font-size:20px}
			.profile-meta p{margin:0 0 8px;color:#bceeff;font-size:14px}
			.profile-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
			.launch-button{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:999px;background:linear-gradient(135deg,#2ec4ff,#0c7ccf);color:white;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;border:0;box-shadow:0 8px 18px rgba(0,0,0,0.2)}
			.launch-button:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,0.24)}
			.launch-button:disabled{opacity:0.7;cursor:wait}
			.footer-note{margin:14px 0 0;color:#ccefff;font-size:13px;line-height:1.5}
			.aqua-bottom-badge{position:fixed;left:18px;bottom:18px;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(0,180,216,0.95),rgba(0,119,182,0.95));color:#f2ffff;border:1px solid rgba(255,255,255,0.22);box-shadow:0 10px 24px rgba(0,0,0,0.28);font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;z-index:9999;pointer-events:none}
		</style>
		<link type="image/png" rel="shortcut icon" href="favicon.png">
		<script type="text/javascript" src="classes.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
					return;
				}
				var relayId = Math.floor(Math.random() * 3);
				window.eaglercraftXOpts = {
					demoMode: false,
					container: "game_frame",
					assetsURI: "assets.epk",
					localesURI: "lang/",
					worldsDB: "worlds",
					servers: [
						{ addr: "wss://play.shadownetwork.shop", name: "Shadow Network" },
						{ addr: "wss://plain-survival1.eagler.host", name: "Survival - An Eaglercraft Server" },
						{ addr: "wss://mc.cosmixmc.org", name: "CosmixMC" }
    					]
				};
				var launchButton = document.getElementById("launch-client");
				var shell = document.querySelector(".aquatic-shell");
				window.launchAquaClient = function() {
					if(window.__aquaClientLaunched) return;
					window.__aquaClientLaunched = true;
					if(launchButton) launchButton.disabled = true;
					if(shell) shell.style.display = "none";
					main();
				};
				if(launchButton) {
					launchButton.addEventListener("click", window.launchAquaClient);
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
		<div class="aquatic-shell">
			<div class="credits-card">
				<div class="credits-badge">AquaClient</div>
				<h1>Welcome to AquaClient</h1>
				<p class="subtext">A polished browser-based launcher for diving into Eaglercraft 1.12.2 with a smooth, ocean-bright first impression.</p>
				<div class="profile-card">
					<img class="avatar-preview" src="assets/skin-placeholder.svg" alt="AquaClient launcher preview">
					<div class="profile-meta">
						<h2>Jamie666</h2>
						<p>Launcher owner • Ocean build</p>
						<div class="profile-actions">
							<button class="launch-button" id="launch-client" type="button">Launch Client</button>
						</div>
					</div>
				</div>
				<p class="footer-note">Ready to jump in? Start the client and head straight into the server list.</p>
			</div>
		</div>
		<div class="aqua-bottom-badge">AquaClient v1.0.0</div>
	</body>
</html>
